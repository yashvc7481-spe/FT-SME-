<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CyberGuard SME</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <a href="../index.html" class="auth-logo" title="Back to Home" style="text-decoration: none; display: inline-block;">
            🛡️
        </a>

        <div style="margin-bottom: 0.75rem;">
            <a href="../index.html" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">← Back to Home</a>
        </div>

        <h1>Welcome Back</h1>

        <p>Login to your cybersecurity dashboard</p>


        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-btn">
                Login
            </button>

        </form>


        <p class="switch">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</div>


<script src="../js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const res = await API.login(email, password);
        if (res.success) {
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userName", res.user.name || "User");
            localStorage.setItem("userEmail", res.user.email || email);
            localStorage.setItem("companyName", res.user.company || "");
            alert("Login successful!");
            window.location.href = "dashboard.html";
            return;
        } else {
            alert(res.message || "Invalid email or password.");
            return;
        }
    } catch (err) {
        console.warn("API login failed, checking local fallback:", err);

        /* Fallback check local demo user */
        const savedUser = localStorage.getItem("cyberGuardUser");
        if (savedUser) {
            const user = JSON.parse(savedUser);
            if (email === user.email && password === user.password) {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("userName", user.name);
                localStorage.setItem("userEmail", user.email);
                localStorage.setItem("companyName", user.company || "");
                alert("Login successful!");
                window.location.href = "dashboard.html";
                return;
            }
        }
        alert(err.message || "Invalid email or password.");
    }
});
</script>
</body>

</html>
